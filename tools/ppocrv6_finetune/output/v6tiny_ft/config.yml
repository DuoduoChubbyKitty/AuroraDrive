  pretrained_model: "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/tools/ppocrv6_finetune/pretrained/PP-OCRv6_tiny_rec_pretrained.pdparams"
  checkpoints: null
  save_inference_dir: "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/tools/ppocrv6_finetune/output/v6tiny_ft/inference"
  use_visualdl: false
  infer_img: "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/tools/ppocrv6_finetune/dataset/clip_20260827_204249_000064.jpg"
  character_dict_path: "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/.venv-paddle/lib/python3.11/site-packages/paddlex/repo_manager/repos/PaddleOCR/ppocr/utils/dict/ppocrv6_tiny_dict.txt"
  max_text_length: 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/tools/ppocrv6_finetune/output/v6tiny_ft/predicts.txt"
  d2s_train_image_shape:
  - 3
  - 48
  - 320
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV4
    model_size: tiny
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: reshape
        Head:
          mid_channels: 80
          use_guide: true
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 25
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/tools/ppocrv6_finetune/dataset"
    ext_op_transform_idx: 1
    label_file_list:
    - "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/tools/ppocrv6_finetune/dataset/train.txt"
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape:
        - 48
        - 320
        - 3
        max_text_length: 25
    - RecAug: null
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales:
    - - 320
      - 32
    - - 320
      - 48
    - - 320
      - 64
    first_bs: 32
    fix_bs: false
    divided_factor:
    - 8
    - 16
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 2
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/tools/ppocrv6_finetune/dataset"
    label_file_list:
    - "/Users/dupi/Desktop/\u81EA\u52A8\u9A7E\u9A76\u7CFB\u7EDF/tools/ppocrv6_finetune/dataset/val.txt"
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 2
profiler_options: null
