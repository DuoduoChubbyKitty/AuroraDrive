        float cyc = floor((uT - phase) / L);
        float age = uT - phase - cyc * L;
        float tb = uT - age;

          c = ballistic(p0, v, age, 0.8);

  function buildGlow(ctx, q) {

    const push = (type, em, slot, slots) => list.push([type, em, slot, slots]);

    for (let i = 0; i < nSpark; i++) push(5, 0, i, nSpark);

    for (let i = 0; i < nIce; i++) push(6, 0, i, nIce);

    const seed = new Float32Array(n * 4), info = new Float32Array(n * 4);
    list.forEach((e, i) => { info.set(e, i * 4); for (let k = 0; k < 4; k++) seed[i * 4 + k] = rnd(); });

        || (t >= E.impact - 0.2 && t < E.scrapeEnd + 5),

  }

          c = mix(A.xyz, B.xyz, aSeed.z) + nrm * side * (3.0 + 10.0 * aSeed.y) * sz;
          size = (5.0 + 7.0 * aSeed.x) * sz * (0.5 + 0.5 * (1.0 - exp(-age * 0.25))) + 0.12 * age;
          alpha = 0.85 * smoothstep(0.0, 1.0, age) * pow(max(1.0 - age / life, 0.0), 1.3);
        }
      } else if (type == 1) {
        // the boil: patches keep appearing while air comes up
        float tb = 221.8 + slot / slots * 15.0 + aSeed.x * 0.6;
        float age = uT - tb;
        float life = 22.0 + 18.0 * aSeed.y;
        if (age > 0.0 && age < life) {
          float ang = aSeed.z * 6.2832, rad = pow(aSeed.w, 0.7) * 34.0;
          c = uPlunge + vec3(cos(ang) * rad, 0.0, sin(ang) * rad);
          size = (4.0 + 7.0 * aSeed.x) * (0.6 + 0.4 * (1.0 - exp(-age * 0.3))) + 0.1 * age;
          alpha = 0.75 * smoothstep(0.0, 1.5, age) * pow(max(1.0 - age / life, 0.0), 1.2);
        }
      } else {
        // an expanding ring of foam around the plunge
        float tb = A.w + 0.2;
        float age = uT - tb;
        float life = 30.0;
        if (age > 0.0 && age < life) {
          float ang = (slot + aSeed.x * 0.8) / slots * 6.2832;
          float rad = (10.0 + 22.0 * (1.0 - exp(-age * 0.25))) * (0.75 + 0.5 * aSeed.y) + 4.0 * sin(ang * 3.0 + aSeed.z * 6.0);
          c = uPlunge + vec3(cos(ang) * rad, 0.0, sin(ang) * rad);
          size = 5.0 + 4.0 * aSeed.z + 0.15 * age;
          alpha = 0.6 * smoothstep(0.0, 0.6, age) * pow(max(1.0 - age / life, 0.0), 1.5);
        }
      }
      if (alpha < 0.003) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      c.y = 0.14;
      float rot = aSeed.w * 6.2832;
      float cr = cos(rot), sr = sin(rot);
      vec2 q = vec2(cr * corner.x - sr * corner.y, sr * corner.x + cr * corner.y) * size;
      vec3 wp = c + vec3(q.x, 0.0, q.y);
      vUv = wp.xz / 22.0 + aSeed.xy;
      vK = corner;
      vAlpha = alpha;
      vCol = vec3(0.85, 0.9, 0.95) * lightAt(c + vec3(0.0, 1.0, 0.0), 0.0);
      vec4 mvPosition = viewMatrix * vec4(wp, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`;

  const FOAM_FRAG = /* glsl */`
    uniform sampler2D uFoam;
    varying vec2 vUv, vK;
    varying float vAlpha;
    varying vec3 vCol;
    void main(){
      vec4 f = texture2D(uFoam, vUv);
      vec4 f2 = texture2D(uFoam, vUv * 2.3 + 0.37);
      float r = length(vK);
      float mask = (1.0 - smoothstep(0.2, 1.0, r + (f.g - 0.5) * 0.7));
      float foam = max(f.r, f2.r * 0.8) * 0.85 + f.b * f2.b * 0.35;
      foam *= smoothstep(0.25, 0.7, f.g * 0.6 + f2.g * 0.6);
      float a = foam * mask * vAlpha * 0.8;
      if (a < 0.003) discard;
      gl_FragColor = vec4(vCol * (0.7 + 0.5 * f.g), min(a, 1.0));
      #include <fog_fragment>
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;

  function buildFoam(ctx, q, foamTex) {
    const list = [];
    const rnd = U.rng('fx-foam-decals');
    const push = (type, em, slot, slots) => list.push([type, em, slot, slots]);
    const nPatch = [0, Math.round(34 * q) + 6, Math.round(70 * q) + 10, Math.round(30 * q) + 6];
    for (let e = 1; e < 4; e++) for (let i = 0; i < nPatch[e]; i++) push(0, e, i, nPatch[e]);
    const nBoil = Math.round(90 * q) + 10;
    for (let i = 0; i < nBoil; i++) push(1, 3, i, nBoil);
    const nRing = 36;
    for (let i = 0; i < nRing; i++) push(2, 3, i, nRing);
    const n = list.length;
    const seed = new Float32Array(n * 4), info = new Float32Array(n * 4);
    list.forEach((e, i) => { info.set(e, i * 4); for (let k = 0; k < 4; k++) seed[i * 4 + k] = rnd(); });
    const geo = quadGeometry(n, { aSeed: [4, seed], aInfo: [4, info] });
    const mat = particleMaterial({
      vertex: FOAM_VERT, fragment: FOAM_FRAG,
      uniforms: Object.assign({ uFoam: { value: foamTex }, uPlunge: { value: PLUNGE } }, EVU),
    });
    mat.polygonOffset = true; mat.polygonOffsetFactor = -2; mat.polygonOffsetUnits = -2;
    const E = EV();
    return addSystem(ctx, 'foam', geo, mat, {
      renderOrder: 6, noReflect: true,
      active: (t, S) => !S.env.underwater && ((t >= E.funnel1Splash && t < E.funnel1Splash + 62) || (t >= E.sternSplash && t < 262)),
    });
  }

  // ==================================================================
  // THE DEEP: bubble streams from the sinking sections, marine snow around the
  // camera, faint light shafts under the surface, the silt cloud of the impact.
  // (all additive or alpha on NO_REFLECT)
  // ==================================================================
  const BUB_PTS = [
    [-24, 4, 5], [-26, -4, -4], [-70, 14, 6], [-112, 12, -3],     // stern section
    [-22, 2, 0], [40, 22, 0], [90, 13, 3], [10, 18, -6],          // bow section
  ].map((a) => new THREE.Vector3(a[0], a[1], a[2]));

  const BUB_VERT = /* glsl */`
    attribute vec2 corner;
    attribute vec4 aSeed;
    attribute vec4 aInfo;
    uniform vec3 uBubPts[8];
    uniform float uDeepDark;
    varying vec2 vK;
    varying vec3 vCol;
    void main(){
      float slot = aInfo.z, slots = aInfo.w;
      float L = 9.0;
      float phase = (slot + aSeed.x) / slots * L;
      float cyc = floor((uT - phase) / L);
      float age = uT - phase - cyc * L;
      float tb = uT - age;
      float r1 = hh(slot, cyc), r2 = hh(slot + 11.0, cyc + 5.0), r3 = hh(slot + 23.0, cyc + 9.0), r4 = hh(slot + 37.0, cyc + 3.0);
      bool bow = tb >= 247.0;
      float live = step(240.0, tb) * step(tb, 255.6) * step(r1, hist(2, tb).x);
      int s = int(mod(slot, 4.0)) + (bow ? 4 : 0);
      vec3 l = uBubPts[s] + (vec3(r2, r3, r4) - 0.5) * vec3(6.0, 3.0, 6.0);
      vec3 p0 = bow ? bowPt(l, tb) : sternPt(l, tb);
      float rad = 0.035 + 0.28 * pow(r3, 3.0) + (r4 > 0.975 ? 0.5 * r2 : 0.0);
      float vr = 0.45 + 2.4 * sqrt(rad);
      vec3 c = p0 + vec3(sin(age * 3.1 + r2 * 6.28) * 0.35 * sqrt(age), vr * age, cos(age * 2.7 + r3 * 6.28) * 0.35 * sqrt(age));
      float alpha = live * smoothstep(0.0, 0.25, age) * (1.0 - smoothstep(L * 0.7, L, age)) * (1.0 - smoothstep(-4.0, -0.5, c.y));
      float pf;
      float size = minPixel(c, rad, pf);
      alpha *= pf;
      if (alpha < 0.003) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      vec3 wp = billboard(c, corner, vec2(size), 0.0);
      vK = corner;
      vCol = vec3(0.55, 0.85, 0.9) * alpha * mix(0.16, 0.05, uDeepDark);
      gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
    }`;
  const BUB_FRAG = /* glsl */`
    varying vec2 vK;
    varying vec3 vCol;
    void main(){
      float r = length(vK);
      if (r > 1.0) discard;
      float rim = smoothstep(0.55, 0.92, r) * (1.0 - smoothstep(0.92, 1.0, r));
      vec2 sp = vK - vec2(-0.3, 0.38);
      float spec = exp(-dot(sp, sp) * 28.0);
      gl_FragColor = vec4(vCol * (rim + 1.6 * spec + 0.1), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;

  const SNOW_VERT = /* glsl */`
    attribute vec2 corner;
    attribute vec4 aSeed;
    uniform float uSnow, uRov;
    varying vec2 vK;
    varying vec3 vCol;
    void main(){
      const float B = 36.0;
      vec3 base = aSeed.xyz * B;
      vec3 drift = vec3(sin(uT * 0.13 + aSeed.w * 6.28) * 0.7, -0.05 * uT, cos(uT * 0.11 + aSeed.x * 6.28) * 0.7);
      vec3 c = mod(base + drift - cameraPosition, B) - B * 0.5 + cameraPosition;
      vec3 dv = c - cameraPosition;
      float d = length(dv);
      float alpha = uSnow * smoothstep(0.9, 2.6, d) * (1.0 - smoothstep(B * 0.32, B * 0.5, d));
      float pf;
      float size = minPixel(c, 0.01 + 0.035 * aSeed.w * aSeed.w, pf);
      alpha *= pf;
      if (alpha < 0.003) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      vec3 fwd = -vec3(viewMatrix[0][2], viewMatrix[1][2], viewMatrix[2][2]);
      float cone = smoothstep(0.55, 0.95, dot(dv / max(d, 1e-3), fwd));
      // each flake catches a little of the cold light filtering down (some glint brighter)
      float gl = 0.55 + 0.9 * pow(fract(aSeed.w * 7.13 + aSeed.x * 3.1), 3.0);
      vec3 L = vec3(0.06, 0.15, 0.16) * gl + vec3(1.0, 0.92, 0.8) * uRov * cone * 2.2 / (1.0 + d * d / 40.0);
      vec3 wp = billboard(c, corner, vec2(size), 0.0);
      vK = corner;
      vCol = L * alpha * 0.6;
      gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
    }`;
  const SNOW_FRAG = /* glsl */`
    varying vec2 vK;
    varying vec3 vCol;
    void main(){
      float r2 = dot(vK, vK);
      if (r2 > 1.0) discard;
      gl_FragColor = vec4(vCol * exp(-r2 * 3.0), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;

  const SHAFT_VERT = /* glsl */`
    attribute vec2 corner;
    attribute vec4 aSeed;
    uniform float uShaft;
    varying vec2 vK;
    varying float vA, vSeed;
    void main(){
      float ang = aSeed.x * 6.2832 + uT * 0.01;
      float dist = 14.0 + 80.0 * aSeed.y;
      vec3 top = vec3(cameraPosition.x + cos(ang) * dist, 0.0, cameraPosition.z + sin(ang) * dist);
      vec3 bot = top + vec3(10.0 * (aSeed.z - 0.5), -170.0, 10.0 * (aSeed.w - 0.5));
      float w = 2.5 + 7.0 * aSeed.z;
      vec3 wp = streak(top, bot, vec2(corner.y, corner.x), w);
      vK = corner;
      vSeed = aSeed.w;
      vA = uShaft * (0.2 + 0.8 * aSeed.y * aSeed.y) * step(0.35, fract(aSeed.w * 13.1));
      gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
    }`;
  const SHAFT_FRAG = /* glsl */`
    varying vec2 vK;
    varying float vA, vSeed;
    void main(){
      float along = 0.5 - vK.y * 0.5;          // 1 at the surface .. 0 deep
      float across = 1.0 - vK.x * vK.x;
      float band = 0.55 + 0.45 * sin(vK.x * 3.0 + uT * 0.5 + vSeed * 20.0) * sin(vK.y * 4.0 - uT * 0.3 + vSeed * 7.0);
      float b = pow(max(along, 0.0), 3.0) * smoothstep(1.0, 0.9, along) * across * across * band * vA;
      gl_FragColor = vec4(vec3(0.02, 0.065, 0.075) * b, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;

  // silt boiling up where the bow section ploughed into the seabed
  const SILT_VERT = /* glsl */`
    attribute vec2 corner;
    attribute vec4 aSeed;
    attribute vec4 aInfo;
    uniform mat4 uBowFinal;
    uniform float uSed, uRov;
    uniform vec3 uLampPos[2];
    uniform vec4 uLampDir[2];      // xyz dir, w cos(outer)
    uniform vec3 uLampCol[2];
    varying vec2 vUv;
    varying float vAlpha, vVar, vEro, vY;
    varying vec3 vCol;
    void main(){
      float x = aInfo.y > 0.5 ? mix(100.0, 134.0, aSeed.x) : mix(-22.0, 130.0, aSeed.x);
      float side = aSeed.w > 0.5 ? 1.0 : -1.0;
      float delay = (134.0 - x) / 158.0 * 2.0 + aSeed.y * 0.4;
      float age = uSed - delay;
      vec3 c = vec3(0.0, -1e5, 0.0);
      float alpha = 0.0, size = 1.0;
      if (age > 0.0) {
        vec3 lp = vec3(x, -10.0 + aSeed.z * 6.0, side * 11.0);
        vec3 p0 = (uBowFinal * vec4(lp, 1.0)).xyz;
        vec3 outD = normalize((uBowFinal * vec4(aInfo.y > 0.5 ? 0.7 : 0.0, 0.0, side, 0.0)).xyz * vec3(1.0, 0.0, 1.0) + 1e-4);
        float v0 = 5.0 + 11.0 * aSeed.z;
        float k = 0.45;
        float rise = (6.0 + 14.0 * aSeed.y * aSeed.y) * (1.0 - exp(-age * 0.45)) + 0.35 * age;
        c = p0 + outD * v0 * (1.0 - exp(-k * age)) / k + vec3(0.0, rise, 0.0);
        c.y = max(c.y, ${C.SEABED_Y.toFixed(1)} + 1.5);
        size = 2.5 + 3.8 * pow(age, 0.72);
        alpha = 0.42 * smoothstep(0.0, 0.35, age) * exp(-age / 40.0);
      }
      if (alpha < 0.003) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      // ROV lamps (or a lamp at the camera when none are found)
      vec3 L = vec3(0.004, 0.012, 0.013);
      for (int i = 0; i < 2; i++) {
        vec3 dl = c - uLampPos[i];
        float d = length(dl);
        float cone = smoothstep(uLampDir[i].w, mix(uLampDir[i].w, 1.0, 0.45), dot(dl / max(d, 1e-3), uLampDir[i].xyz));
        L += uLampCol[i] * cone / (1.0 + d * d / 900.0);
      }
      vec3 wp = billboard(c, corner, vec2(size), aSeed.w * 6.28 + age * 0.03);
      vUv = corner * 0.5 + 0.5;
      vAlpha = alpha; vVar = floor(aSeed.z * 3.999); vEro = 0.1 + 0.3 * smoothstep(0.0, 30.0, age);
      vCol = vec3(0.42, 0.39, 0.33) * L / (1.0 + 0.6 * dot(L, vec3(0.3333)));   // lit, never a white wall
      vY = wp.y;
      gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
    }`;
  const SILT_FRAG = GLSL_PUFF_FRAG + /* glsl */`
    varying vec2 vUv;
    varying float vAlpha, vVar, vEro, vY;
    varying vec3 vCol;
    void main(){
      vec4 tx = puffTex(vUv, vVar);
      float d = tx.r * smoothstep(vEro, vEro + 0.45, tx.b * 0.6 + tx.r * 0.6);
      // thin out toward the silt it rose from: no hard line where the puff meets the seabed
      float a = d * vAlpha * smoothstep(${C.SEABED_Y.toFixed(1)} - 0.5, ${C.SEABED_Y.toFixed(1)} + 4.0, vY);
      if (a < 0.003) discard;
      gl_FragColor = vec4(vCol * (0.75 + 0.5 * tx.g), a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;

  function buildDeep(ctx, q, puffTex) {
    const out = {};
    const E = EV();
    const rnd = U.rng('fx-deep');
    const mk = (n, withInfo) => {
      const seed = new Float32Array(n * 4), info = new Float32Array(n * 4);
      for (let i = 0; i < n; i++) { for (let k = 0; k < 4; k++) seed[i * 4 + k] = rnd(); info.set([0, 0, i, n], i * 4); }
      const a = { aSeed: [4, seed] };
      if (withInfo) a.aInfo = [4, info];
      return { a, info };
    };
    // bubbles
    let g = mk(Math.round(1800 * q), true);
    out.bubbles = addSystem(ctx, 'bubbles', quadGeometry(Math.round(1800 * q), g.a),
      particleMaterial({ vertex: BUB_VERT, fragment: BUB_FRAG, blending: 'add', fog: false,
        uniforms: { uBubPts: { value: BUB_PTS }, uDeepDark: { value: 0 } } }),
      { renderOrder: 15, noReflect: true, active: (t, S) => S.env.underwater && t >= E.underwater && t < E.seabedImpact + 9 });
    // marine snow
    const nSnow = Math.round(2600 * q);
    g = mk(nSnow, false);
    out.snow = addSystem(ctx, 'marineSnow', quadGeometry(nSnow, g.a),
      particleMaterial({ vertex: SNOW_VERT, fragment: SNOW_FRAG, blending: 'add', fog: false,
        uniforms: { uSnow: { value: 0 }, uRov: { value: 0 } } }),
      { renderOrder: 16, noReflect: true, active: (t, S) => S.fx.marineSnow > 0 && S.env.underwater });
    // light shafts
    g = mk(16, false);
    out.shafts = addSystem(ctx, 'shafts', quadGeometry(16, g.a),
      particleMaterial({ vertex: SHAFT_VERT, fragment: SHAFT_FRAG, blending: 'add', fog: false, uniforms: { uShaft: { value: 0 } } }),
      { renderOrder: 7, noReflect: true, active: (t, S) => S.env.underwater && t >= E.underwater && t < E.abyss });
    // silt
    const nSilt = Math.round(240 * q) + 20;
    g = mk(nSilt, true);
    for (let i = 0; i < nSilt; i++) g.info[i * 4 + 1] = i < nSilt * 0.3 ? 1 : 0;   // 30 % burst from the buried nose
    out.silt = addSystem(ctx, 'silt', quadGeometry(nSilt, g.a),
      particleMaterial({ vertex: SILT_VERT, fragment: SILT_FRAG, fog: false,
        uniforms: {
          uPuff: { value: puffTex }, uBowFinal: { value: new THREE.Matrix4() }, uSed: { value: 0 }, uRov: { value: 0 },
          uLampPos: { value: [new THREE.Vector3(), new THREE.Vector3()] },
          uLampDir: { value: [new THREE.Vector4(0, -1, 0, 0.9), new THREE.Vector4(0, -1, 0, 0.9)] },
          uLampCol: { value: [new THREE.Vector3(), new THREE.Vector3()] },
        } }),
      { renderOrder: 11, noReflect: true, active: (t, S) => S.fx.sediment > 0 && S.env.underwater });
    // the bow section at rest on the seabed
    const st = TT.story.makeState();
    TT.story.sample(E.seabedImpact + 5, st);
    TT.pose.matrix(st.ship.bow, out.silt.mat.uniforms.uBowFinal.value);
    return out;
  }

  // ROV lamps: props owns the SpotLights; find them once the seabed scene is on
  let _spots = null, _spotScan = -1;
  function findSpots(scene, t) {
    if (_spots && _spots.length) return _spots;
    if (Math.abs(t - _spotScan) < 1.5) return _spots;
    _spotScan = t;
    const found = [];
    scene.traverse((o) => { if (o.isSpotLight) found.push(o); });
    _spots = found.slice(0, 2);
    return _spots;
  }

  // ==================================================================
  // MIST: low banks drifting over the water (the silence, the dawn). A field of
  // wide soft sprites wrapped around the camera; upright when seen from sea level,
  // lying flat when seen from above.
  // ==================================================================
  const MIST_P = 1800.0;
  const MIST_VERT = /* glsl */`
    attribute vec2 corner;
    attribute vec4 aSeed;
    uniform float uMist, uWindSpd;
    uniform vec3 uMistCol, uSunDir, uSunCol;
    varying vec2 vUv;
    varying float vAlpha, vVar;
    varying vec3 vCol, vWorld;
    void main(){
      const float P = ${MIST_P.toFixed(1)};
      vec2 base = aSeed.xy * P;
      vec2 drift = uWind.xz * (uWindSpd * 0.9 + 0.3) * uT;
      vec2 rel = mod(base + drift - cameraPosition.xz + P * 0.5, P) - P * 0.5;
      float d = length(rel);
      float h = 2.0 + aSeed.z * 12.0;
      vec3 c = vec3(cameraPosition.x + rel.x, h, cameraPosition.z + rel.y);
      vec3 toC = cameraPosition - c;
      vec2 fh = -toC.xz / max(length(toC.xz), 1e-3);
      vec3 right = vec3(-fh.y, 0.0, fh.x);
      float e = smoothstep(0.08, 0.45, (cameraPosition.y - h) / max(d, 1.0));
      vec3 upA = normalize(mix(vec3(0.0, 1.0, 0.0), vec3(fh.x, 0.0, fh.y), e));
      float w = 70.0 + 130.0 * aSeed.w;
      float hh_ = mix(8.0 + 10.0 * aSeed.z, w * 0.55, e);
      vec3 wp = c + right * corner.x * w + upA * corner.y * hh_;
      wp.y = max(wp.y, 0.2);
      vWorld = wp;
      vUv = corner * 0.5 + 0.5;
      vVar = floor(aSeed.z * 3.999);
      vAlpha = uMist * 0.4 * smoothstep(35.0, 160.0, d) * (1.0 - smoothstep(P * 0.32, P * 0.48, d));
      vec3 vd = normalize(c - cameraPosition);
      float fwdS = pow(max(dot(vd, uSunDir), 0.0), 5.0);
      vCol = uMistCol + uSunCol * fwdS;
      vec4 mvPosition = viewMatrix * vec4(wp, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`;
  const MIST_FRAG = GLSL_PUFF_FRAG + /* glsl */`
    varying vec2 vUv;
    varying float vAlpha, vVar;
    varying vec3 vCol, vWorld;
    void main(){
      vec4 tx = puffTex(vUv, vVar);
      float a = mix(tx.r, tx.a, 0.4) * vAlpha;
      a *= smoothstep(0.0, 3.0, vWorld.y);
      if (a < 0.002) discard;
      gl_FragColor = vec4(vCol, a);
      #include <fog_fragment>
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;
  function buildMist(ctx, q, puffTex) {
    const n = Math.round(110 * q) + 20;
    const rnd = U.rng('fx-mist');
    const seed = new Float32Array(n * 4);
    for (let i = 0; i < n * 4; i++) seed[i] = rnd();
    const mat = particleMaterial({
      vertex: MIST_VERT, fragment: MIST_FRAG,
      uniforms: {
        uPuff: { value: puffTex }, uMist: { value: 0 }, uWindSpd: { value: 1 },
        uMistCol: { value: new THREE.Vector3() }, uSunDir: { value: new THREE.Vector3(-1, 0.05, 0) }, uSunCol: { value: new THREE.Vector3() },
      },
    });
    return addSystem(ctx, 'mist', quadGeometry(n, { aSeed: [4, seed] }), mat, {
      renderOrder: 5, noReflect: true,
      active: (t, S) => S.env.mist > 0.1 && !S.env.underwater,
    });
  }

  // ==================================================================
  // ICE: chunks broken off the berg tumbling onto the forward well deck; they stay
  // there (ship-local) as she settles. MeshStandardMaterial so they catch the ship's lights.
  // ==================================================================
  function buildIce(ctx, q) {
    const n = Math.round(56 * Math.max(q, 0.6));
    const rnd = U.rng('fx-ice');
    // an irregular splinter of clear ice: the convex hull of points scattered through a
    // flattened, elongated ellipsoid (a sharp-faceted shard, not a gem)
    let g0 = null;
    const A = TT.addons || (typeof ADDONS !== 'undefined' ? ADDONS : null);
    if (A && A.ConvexGeometry) {
      const pts = [];
      for (let i = 0; i < 11; i++) {
        const u = rnd() * 2 - 1, ph = rnd() * Math.PI * 2, rr = 0.55 + 0.45 * rnd();
        const sq = Math.sqrt(1 - u * u);
        pts.push(new THREE.Vector3(u * 1.5 * rr, sq * Math.cos(ph) * 0.45 * rr, sq * Math.sin(ph) * 0.8 * rr));
      }
      pts.push(new THREE.Vector3(1.6, 0.05, 0.1), new THREE.Vector3(-1.3, -0.08, -0.15));   // the sharp ends
      try { g0 = new A.ConvexGeometry(pts); } catch (e) { g0 = null; }
    }
    if (!g0) { g0 = new THREE.OctahedronGeometry(1, 0); g0.scale(1.5, 0.5, 0.8); }
    g0.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: 0xcfe0ec, roughness: 0.12, metalness: 0.0, flatShading: true,
      emissive: 0x1e3040, emissiveIntensity: 0.4,
    });
    const mesh = new THREE.InstancedMesh(g0, mat, n);
    mesh.name = 'fx.iceChunks';
    mesh.frustumCulled = false;
    mesh.layers.set(TT.LAYERS.NO_REFLECT);
    mesh.visible = false;
    mesh.matrixAutoUpdate = false;
    const E = EV();
    const chunks = [];
    for (let i = 0; i < n; i++) {
      const r = () => rnd();
      const x0 = 69 + r() * 27;
      const c = {
        tf: E.impact + 0.5 + (97 - x0) / 31 * 3.2 + r() * 0.7,
        p0: new THREE.Vector3(x0, 23 + r() * 9, 14.5 + r() * 4),
        p1: new THREE.Vector3(x0 - 1 - r() * 3, 0, 11 - Math.pow(r(), 0.8) * 21),
        size: 0.14 + Math.pow(r(), 2.4) * 0.55,
        shape: new THREE.Vector3(0.75 + 0.5 * r(), 0.6 + 0.6 * r(), 0.7 + 0.5 * r()),
        axis: new THREE.Vector3(r() - 0.5, r() - 0.5, r() - 0.5).normalize(),
        spin: 3 + r() * 8,
        rest: new THREE.Quaternion().setFromEuler(new THREE.Euler(r() * 6, r() * 6, r() * 6)),
      };
      c.p1.y = SH.WELL_DECK_Y + c.size * 0.55;
      c.tFall = Math.sqrt((2 * (c.p0.y - c.p1.y)) / 9.81);
      chunks.push(c);
    }
    ctx.scene.add(mesh);
    const q_ = new THREE.Quaternion(), s_ = new THREE.Vector3(), p_ = new THREE.Vector3(), mL = new THREE.Matrix4(), mB = new THREE.Matrix4();
    return {
      mesh, chunks,
      update(t, S) {
        const on = t > E.impact && t < E.breakStart - 10 && S.ship.visible;
        mesh.visible = on;
        if (!on) return;
        TT.pose.matrix(S.ship.bow, mB);
        let shown = 0;
        for (let i = 0; i < chunks.length; i++) {
          const c = chunks[i];
          const a = t - c.tf;
          if (a < 0) { mL.makeScale(0, 0, 0); mesh.setMatrixAt(i, mL); continue; }
          let u;
          if (a < c.tFall) {
            u = a / c.tFall;
            p_.lerpVectors(c.p0, c.p1, u);
            p_.y = c.p0.y - 0.5 * 9.81 * a * a;
          } else {
            // slide / skid to rest with a small bounce
            const b = a - c.tFall;
            const k = 1 - Math.exp(-b * 3);
            p_.copy(c.p1);
            p_.x += (c.p1.x - c.p0.x) * 0.3 * k;
            p_.z += (c.p1.z - c.p0.z) * 0.12 * k;
            p_.y += Math.max(0, Math.sin(Math.min(b, 0.45) / 0.45 * Math.PI)) * 0.35 * c.size;
          }
          const ang = c.spin * Math.min(a, c.tFall + 0.5);
          q_.setFromAxisAngle(c.axis, ang).multiply(c.rest);
          s_.copy(c.shape).multiplyScalar(c.size);
          mL.compose(p_, q_, s_);
          mL.premultiply(mB);
          // once the flooding well deck takes them, they float off: hide
          if (mL.elements[13] < 0.15) mL.makeScale(0, 0, 0);
          mesh.setMatrixAt(i, mL);
        }
        mesh.instanceMatrix.needsUpdate = true;
      },
    };
  }

  // ==================================================================
  // the remaining systems: build + per-frame hooks
  // ==================================================================
  const _sunDir = new THREE.Vector3(), _col = new THREE.Color();
  function buildMore(ctx, q, self) {
    const foamTex = makeFoamTexture();
    const puff = self._tex.puff;
    self._tex.foam = foamTex;
    self.sys.foam = buildFoam(ctx, q, foamTex);
    Object.assign(self.sys, buildDeep(ctx, q, puff));
    self.sys.mist = buildMist(ctx, q, puff);
    self.ice = buildIce(ctx, q);
  }

  fx.updateMore = function (t, dt, ctx) {
    const S = ctx.S, sys = this.sys;
    if (this.ice) this.ice.update(t, S);
    const E = S.env;
    const deep = U.smoothstep(20, 600, E.depth || 0);
    if (sys.bubbles) sys.bubbles.mat.uniforms.uDeepDark.value = deep;
    if (sys.snow) {
      sys.snow.mat.uniforms.uSnow.value = S.fx.marineSnow * (1 - 0.3 * deep);
      sys.snow.mat.uniforms.uRov.value = S.fx.rov;
    }
    if (sys.shafts) sys.shafts.mat.uniforms.uShaft.value = E.underwater ? (1 - U.smoothstep(15, 150, E.depth || 0)) : 0;
    if (sys.silt) {
      const u = sys.silt.mat.uniforms;
      u.uSed.value = S.fx.sediment;
      u.uRov.value = S.fx.rov;
      const spots = S.fx.sediment > 0 ? findSpots(ctx.scene, t) : null;
      for (let i = 0; i < 2; i++) {
        const sp = spots && spots[i];
        if (sp && sp.visible !== false) {
          sp.getWorldPosition(u.uLampPos.value[i]);
          sp.target.getWorldPosition(_v1);
          _v1.sub(u.uLampPos.value[i]).normalize();
          u.uLampDir.value[i].set(_v1.x, _v1.y, _v1.z, Math.cos(sp.angle || 0.6));
          const k = Math.min(3, (sp.intensity || 0) / 1500);
          u.uLampCol.value[i].set(sp.color.r, sp.color.g, sp.color.b).multiplyScalar(k);
        } else if (i === 0) {
          // no ROV lamps in the scene: a lamp at the camera, as if the ROV were filming
          u.uLampCol.value[0].set(1.0, 0.93, 0.82).multiplyScalar(2.2 * (0.15 + 0.85 * S.fx.rov));
          u.uLampDir.value[0].w = -2;   // recomputed in render (needs the director's camera)
          this._camLamp = true;
        } else u.uLampCol.value[i].set(0, 0, 0);
      }
    }
    if (sys.mist) {
      const u = sys.mist.mat.uniforms;
      u.uMist.value = E.mist;
      u.uWindSpd.value = E.wind;
      // night: a faint grey-blue veil; dawn: the horizon colour, lit rose-gold toward the sun
      const sky = TT.sky;
      const dawn = U.clamp(E.dawn);
      if (sky && sky.horizonColor && sky.horizonColor.isColor) _col.copy(sky.horizonColor);
      else _col.setRGB(0.012, 0.02, 0.035).lerp(new THREE.Color(0.55, 0.42, 0.45), dawn);
      u.uMistCol.value.set(_col.r, _col.g, _col.b).multiplyScalar(1.3).add(SU.uAmb.value.clone().multiplyScalar(1.5));
      if (sky && sky.sunDir && sky.sunDir.isVector3) _sunDir.copy(sky.sunDir); else _sunDir.set(-1, 0.04, -0.15);
      u.uSunDir.value.copy(_sunDir).normalize();
      u.uSunCol.value.set(1.0, 0.62, 0.38).multiplyScalar(0.9 * dawn);
    }
  };

  fx.renderMore = function (ctx) {
    const sys = this.sys;
    if (sys.silt && this._camLamp && sys.silt.mesh.visible) {
      const u = sys.silt.mat.uniforms;
      const cam = ctx.camera;
      cam.getWorldPosition(u.uLampPos.value[0]);
      cam.getWorldDirection(_v1);

    }
    this._camLamp = false;
  };

  // ==================================================================
  // LIFECYCLE
  // ==================================================================
  const FLASH_COL = new THREE.Color(1.0, 0.93, 0.8);    // magnesium white, warm (#fff5e0-ish, linear)
  const SPARK_COL = new THREE.Color(1.0, 0.45, 0.14);
  const _amb = new THREE.Vector3();

  // intensity envelope (0..1+) of rocket r at story time t, and where its light is
  function rocketFlash(r, t, outPos) {
    const L = RK.L[r];
    if (L == null) return 0;
    const ra = t - L;
    if (ra < 0 || ra > RK_T + 7.5) return 0;
    const ba = ra - RK_T;
    let I = 0;
    const p0 = RK.p0[r], dir = RK.dir[r], H = RKU.uRkDir.value[r].w;
    if (ra < RK_T) {
      const u = ra / RK_T;
      outPos.copy(p0).addScaledVector(dir, Math.max(6, H * (1 - (1 - u) * (1 - u))));
      I = 0.03 + (ra < 0.35 ? 0.05 * (1 - ra / 0.35) : 0);
    } else {

      const e = (1 - Math.exp(-STAR_K * ba)) / STAR_K;
      outPos.copy(p0).addScaledVector(dir, H);

      outPos.y += 0.125 * STAR_V0 * e - (9.81 / STAR_K) * (ba - e);

      white: buildWhitePuffs(ctx, q, puff),
      spray: buildSpray(ctx, q, puff),
      glow: buildGlow(ctx, q),
    };
    if (typeof buildMore === 'function') buildMore(ctx, q, this);

    const rl = new THREE.PointLight(0xfff0dc, 0, 2600, 2);
    rl.name = 'fx.rocketLight';

    sl.name = 'fx.sparkLight';
    rl.position.set(0, -1e4, 0); sl.position.set(0, -1e4, 0);
    ctx.scene.add(rl, sl);
    this.lights = [rl, sl];
    this.rocketLight = rl; this.sparkLight = sl;
  };

  fx.update = function (t, dt, ctx) {
    const S = ctx.S;
    SU.uT.value = t;
    if (captureAnchors(S)) { buildRockets(); buildEvents(); }

    // ambient light for particles: starlight at night, the dawn sky later, dim teal underwater
    const E = S.env;
    const night = _amb.set(0.036, 0.05, 0.085);
    const dawn = E.dawn;
    if (dawn > 0) night.lerp(_v1.set(0.42, 0.36, 0.38), U.clamp(dawn));
    if (E.underwater) night.set(0.004, 0.012, 0.014);
    SU.uAmb.value.copy(night);

    // the lit ship (warm) along its length
    const lights = S.ship.visible ? S.ship.lights : 0;
    SU.uShipLight.value.set(1.0, 0.62, 0.32).multiplyScalar(1.6 * lights);
    TT.pose.toWorld(S.ship.stern, _v1.set(-110, 12, 0), SU.uShipA.value);
    TT.pose.toWorld(S.ship.bow, _v1.set(120, 12, 0), SU.uShipB.value);
    SU.uWind.value.set(-0.6, 0, -0.8);
    const wind = E.wind;
    for (const s of this.systems) if (s.mat.uniforms.uWindSpd) s.mat.uniforms.uWindSpd.value = wind;

    // ---------------- flashes (rockets 0/1, break sparks 2) and the two PointLights ----------------
    const F = TT.flashes;
    let best = -1, bestI = 0, second = -1, secondI = 0;
    const pos = [_v1, _v2];
    for (let r = 0; r < RK.L.length; r++) {
      const I = rocketFlash(r, t, _v3);
      if (I > bestI) { second = best; secondI = bestI; pos[1].copy(pos[0]); best = r; bestI = I; pos[0].copy(_v3); }
      else if (I > secondI) { second = r; secondI = I; pos[1].copy(_v3); }
    }
    const setFlash = (f, I, p, col, range) => {
      f.intensity = I; f.range = range; f.color.copy(col);
      if (I > 0) f.pos.copy(p); else f.pos.set(0, -1e5, 0);
    };
    setFlash(F[0], bestI * 6, pos[0], FLASH_COL, 700);
    setFlash(F[1], secondI * 6, pos[1], FLASH_COL, 700);
    // break sparks
    const bs = S.fx.breakSparks;
    let sparkI = 0;
    if (bs > 0.01) {
      TT.pose.toWorld(S.ship.bow, ANCH.breakTop, _v3);
      TT.pose.toWorld(S.ship.stern, ANCH.breakTop, _v1);
      _v3.add(_v1).multiplyScalar(0.5);
      _v3.y -= 3;
      const fl = 0.65 + 0.35 * U.noise1(t * 11, 3) + 0.2 * U.noise1(t * 29, 5);
      sparkI = bs * U.clamp(fl, 0.2, 1.3);
      setFlash(F[2], sparkI * 2.5, _v3, SPARK_COL, 90);
      this.sparkLight.position.copy(_v3);
    } else setFlash(F[2], 0, _v3, SPARK_COL, 90);
    this.sparkLight.intensity = sparkI * 9000;
    F[3].intensity = 0; F[3].pos.set(0, -1e5, 0);
    if (bestI > 0) {
      this.rocketLight.position.copy(F[0].pos);
      this.rocketLight.intensity = bestI * 3.2e5;
    } else this.rocketLight.intensity = 0;
    for (let i = 0; i < 4; i++) {
      SU.uFlashPos.value[i].copy(F[i].pos);
      // on particles the break sparks are a local light (steam and dust at the tear), not a
      // floodlight: dimmer and short-ranged, so distant splash mist doesn't glow
      SU.uFlashCol.value[i].set(F[i].color.r, F[i].color.g, F[i].color.b).multiplyScalar(F[i].intensity * (i < 2 ? 1 : 0.4));
      SU.uFlashRange.value[i] = F[i].range * (i < 2 ? 0.55 : 0.35);
    }

    for (const s of this.systems) {
      let on = false;
      try { on = !!s.active(t, S); } catch (e) { on = false; }
      s.mesh.visible = on;
    }
    if (this.updateMore) this.updateMore(t, dt, ctx);
  };

  // world position where distress rocket r bursts (used by the director to frame it)
  fx.rocketBurst = function (r, out) {
    out = out || new THREE.Vector3();
    const p0 = RK.p0[r], dir = RK.dir[r];
    if (!p0) return null;
    return out.copy(p0).addScaledVector(dir, RKU.uRkDir.value[r].w);
  };
  // 0..1+ brightness of rocket r's flash at story time t (and its light position in `outPos`)
  fx.rocketFlash = function (r, t, outPos) { return rocketFlash(r, t, outPos || new THREE.Vector3()); };

  fx.resize = function (w, h) {
    if (!this.post) return;
    const r = this.ctx.renderer;
    this.post.composer.setPixelRatio(r.getPixelRatio());
    this.post.composer.setSize(w, h);
  };

  fx.render = function (ctx, dt) {

    if (!P) { r.render(ctx.scene, cam); return; }

    SU.uCamUnder.value = cam.position.y < 0 ? 1 : 0;
    SU.uPxScale.value = (ctx.height * pr) / (2 * Math.tan((cam.fov * Math.PI) / 360));

    const gu = P.gradeMat.uniforms;
    gu.uExposure.value = G.exposure;
    gu.uSat.value = G.saturation;
    gu.uContrast.value = G.contrast * 1.06;
    gu.uWarmth.value = G.warmth;
    gu.uVignette.value = G.vignette;
    gu.uUnder.value = G.underwater;
    gu.uDawn.value = U.clamp(E.dawn);
    gu.uNight.value = 1 - U.clamp(E.dawn);
    gu.uDepthDark.value = U.smoothstep(20, 400, E.depth || 0);
    gu.uHalation.value = 0.35 * (G.bloom != null ? G.bloom : 1);
    gu.uStreak.value = this.q >= 0.6 ? 0.06 * (G.bloom != null ? G.bloom : 1) : 0;
    // the water volume: cold teal light scattered through the deep (sunlit green-teal near the
    // surface, a faint blue-teal in the abyss) so the black wreck reads against it
    const under = E.underwater ? U.clamp(G.underwater) : 0;
    gu.uAbyss.value = under;
    if (under > 0) {
      const dp = E.depth || 0;
      const kd = U.smoothstep(12, 400, dp);
      gu.uAbyssCol.value.set(U.lerp(0.0065, 0.0036, kd), U.lerp(0.036, 0.0175, kd), U.lerp(0.042, 0.024, kd))
        .multiplyScalar(U.lerp(1.0, 0.82, U.smoothstep(1500, 3790, dp)));
      gu.uAbyssK.value = U.lerp(0.014, 0.0065, kd);
      gu.uMurkT.value = S.t;
      gu.tDepth.value = P.scenePass.rt ? P.scenePass.rt.depthTexture : null;
      gu.uNear.value = cam.near; gu.uFar.value = cam.far;
      cam.updateMatrixWorld();
      gu.uProjInv.value.copy(cam.projectionMatrixInverse);
      cam.getWorldPosition(gu.uCamPos.value);
      // the water colour as the grade leaves it (exposure, cold balance, the underwater filter)
      const fog = ctx.scene.fog;
      if (fog && fog.color) {
        const dd = gu.uDepthDark.value, cw = U.clamp(-G.warmth);
        gu.uFogT.value.set(fog.color.r * U.lerp(1, 0.86, cw) * U.lerp(0.30, 0.72, dd), fog.color.g * U.lerp(1, 0.97, cw) * U.lerp(0.85, 0.9, dd),
          fog.color.b * U.lerp(1, 1.14, cw)).multiplyScalar(G.exposure * 1.1);
      } else gu.uFogT.value.set(0, 0, 0);
      gu.uCamRot.value.setFromMatrix4(cam.matrixWorld);
      if (!gu.tDepth.value) gu.uAbyss.value = 0;
    }
    const b = P.bloom;
    b.strength = 0.65 * (G.bloom != null ? G.bloom : 1);
    b.radius = 0.6;
    b.threshold = 0.9;
    const fu = P.finMat.uniforms;
    fu.uGrain.value = G.grain;
    fu.uFade.value = U.clamp(Math.max(G.fade, (cam.userData && cam.userData.fade) || 0));
    fu.uTime.value = ctx.realTime;
    fu.uPx.value = Math.max(1, 1.25 * pr * (ctx.height / 1080));
    fu.uCA.value = 0.012;

    P.composer.render(dt);
    // report the scene pass (not the post quads) through renderer.info like a plain render would
    const inf = r.info.render;
    inf.calls = this.stats.sceneCalls; inf.triangles = this.stats.sceneTris;
    inf.points = this.stats.scenePoints || 0; inf.lines = this.stats.sceneLines || 0;
  };
})();

// =====================================================================
// 70_director.js — cinematography and editing. Owns ctx.camera for the whole film.
// Owner: director agent.
//
// The film is a list of shots, each a pure function of story time t (reads TT.S only).
// A shot fills a "rig" (position, look-at target, roll, lens, focus, aperture, fade);
// the director then adds handheld drift and shake (procedural noise of t), keeps the
// camera out of the water / hull / berg, and converts the lens to a camera fov that
// frames the 2.39:1 letterbox band identically on any window aspect.
//
// Lens convention: rig.lens = vertical field of view (deg) of the 2.39:1 band.
// World/ship conventions: see CONTRACT.md (ship-local +X bow, +Z starboard).
//
// Film grammar: majestic and elegiac; long takes; low angles near the mirror-calm water;
// the starboard (north) side is "our" side for most of the night (she steams left to
// right, the berg strikes on our side); handheld only in the chaos; the Milky Way (high in
// the east, its core low in the south-south-east) and the aurora (north) are framed
// deliberately. Fades: dips to black at 92, 156.7, 222 and inside the deep (247); the
// story's own fades cover the opening, 240, 262 and the end.
// Two cameras ride with lifeboats (TT.props.boatWorld, evaluated after props each frame):
// the long hold on the vertical stern (behind No. 13) and No. 14 going back (235-240).
// The wireless form (upper left, 95.5-125 / 139-157 s) and the depth gauge (right edge,
// 246.5-260.5 s) are kept clear of the key action.
//
// API: TT.director.shots [{name, t0, t1}], shotAt(t), boatPos(i, out).
// Camera hints written every frame: userData.fade, focus, aperture, shot, letterbox (null),
// cut (true on the first frame of a new shot).
// =====================================================================
(() => {
  const U = TT.util, C = TT.CONST, SH = C.SHIP, DEG = U.DEG;
  const ST = TT.story, EV = ST.EV, TR = ST.TR;
  const BAND = 2.39;
  const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const clamp = U.clamp, lerp = U.lerp, sstep = U.smoothstep, ease = U.easeInOutSine;
  const H_FINAL = TR.heading(130); // settled heading after the collision (~22 deg)

  // -------------------------------------------------------------------
  // scratch (no allocation per frame)
  // -------------------------------------------------------------------
  const _l = V3(), _a = V3(), _b = V3(), _c = V3(), _d = V3();
  const _tv = new THREE.Vector2();
  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _qe = new THREE.Euler();
  const UP = V3(0, 1, 0);
  const _poseTmp = TT.pose.create();

  // current frame state (set in update)
  let S = TT.S;

  // -------------------------------------------------------------------
  // Frames
  // -------------------------------------------------------------------
  // Level, yaw-only ship frame about the midship origin (external cameras on the water).
  function yawW(x, y, z, h, out) {
    const c = Math.cos(h), s = Math.sin(h);
    return out.set(x * c + z * s, y, -x * s + z * c);
  }
  // Ship-local point through a pose (cameras riding the ship; subjects on the ship).
  function poseW(pose, x, y, z, out) { return TT.pose.toWorld(pose, _l.set(x, y, z), out); }
  const shipW = (x, y, z, out) => poseW(S.ship.intact, x, y, z, out);
  const bowW = (x, y, z, out) => poseW(S.ship.bow, x, y, z, out);
  const sternW = (x, y, z, out) => poseW(S.ship.stern, x, y, z, out);
  // A point fixed in the water: defined in the level ship frame at time t0 (heading and
  // travel at t0), rendered at the current time (the sea scrolls by -travel).
  function pinW(x, y, z, t0, out) {
    yawW(x, y, z, TR.heading(t0), out);
    ST.travelAt(t0, _tv);
    out.x += _tv.x - S.ship.travel.x;
    out.z += _tv.y - S.ship.travel.y;
    return out;
  }
  function anchor(name, fallbackLocal, section, out) {
    const sh = TT.ship;
    if (sh && sh._ready && sh.anchor) {
      try { const r = sh.anchor(name, out); if (r && isFinite(r.x)) return out; } catch (e) { /* fall back */ }
    }
    const pose = section === 'stern' ? S.ship.stern : section === 'intact' ? S.ship.intact : S.ship.bow;
    return poseW(pose, fallbackLocal.x, fallbackLocal.y, fallbackLocal.z, out);
  }

  // Lifeboat world position (props when present, else a matching estimate).
  function boatPos(i, out) {
    const P = TT.props;
    if (P && P._ready && P.boatWorld) {
      try { const r = P.boatWorld(i, out); if (r && isFinite(r.x)) return out; } catch (e) { /* fall back */ }
    }
    const b = ST.BOATS[i], slot = SH.BOAT_SLOTS[b.slot];
    const t = S.t;
    const tl = Math.min(t, b.lowerT1);
    ST.intactPose(Math.min(tl, EV.breakStart), _poseTmp);
    const side = slot.side;
    const k = clamp((t - b.lowerT0) / (b.lowerT1 - b.lowerT0));
    TT.pose.toWorld(_poseTmp, _l.set(slot.local.x, slot.local.y, slot.local.z + side * 2.4 * sstep(0, 0.12, k)), out);
    out.y = lerp(out.y, 0.3, U.easeInOutSine(sstep(0.1, 1, k)));
    if (t > b.lowerT1) {
      const d = ST.boatRowDistance(b, t);
      const h = TR.heading(b.lowerT1) + (side > 0 ? 0 : Math.PI) + b.dir * side;
      out.x += Math.sin(h) * d * 1.0;
      out.z += Math.cos(h) * d * 1.0;
      out.y = 0.3;
    }
    return out;
  }

  // geometry fx uses: from the starboard bridge-wing launcher, ~220 m up, leaning ~12 deg outboard.
  const _rkPose = TT.pose.create();
  function rocketBurst(r, out) {
    const F = TT.fx;
    if (F && F._ready && F.rocketBurst) {

    }

  }
  function seaY(x, z) {

  // Smooth multi-key vector path: keys [[t, [x,y,z]], ...] -> f(t, out)
  function vpath(keys) {
    const cx = U.curve(keys.map((k) => [k[0], k[1][0]]));
    const cy = U.curve(keys.map((k) => [k[0], k[1][1]]));
    const cz = U.curve(keys.map((k) => [k[0], k[1][2]]));
    return (t, out) => out.set(cx(t), cy(t), cz(t));

    R.tgt.set(Math.sin(cy) * Math.cos(cp), Math.sin(cp), Math.cos(cy) * Math.cos(cp)).multiplyScalar(100).add(R.pos);
    return R;

    sternBearing(lerp(158, 162, s.u), lerp(250, 238, s.u), 2.2 + nz(s.t, 0.3, 21) * 0.15, R.pos);
    R.lens = 25; R.near = 1.5;
    sternW(-85, 20, 0, _a);
    _a.y = lerp(10, 22, ease(s.u));
    placeAt(R, _a, 0.3, -0.36); // her on the right third, low; the core of the Milky Way on the left
    R.roll = nz(s.t, 0.2, 22) * 1.0 * DEG;
  }, { shake: 0.25, hand: 0.45 });

  shot('break_vertical', 210.5, 218, (s, R) => {
    // the long hold: low on the water ~190 m off her starboard side, from behind lifeboat No. 13
    // pulling away; she swings up and stands straight, a black profile (counter, rudder, screws)
    // against the Milky Way, which arches over her from its core low in the south-south-east;
    // other boats' lanterns lie scattered along the horizon. She begins to slide at 216.5.
    boatPos(10, _a);
    _b.set(_a.x - STERN_W.x, 0, _a.z - STERN_W.z).normalize();           // from the stern out to the boat
    R.pos.copy(_a).addScaledVector(_b, lerp(38, 31, ease(s.u))).addScaledVector(_c.set(-_b.z, 0, _b.x), 7.5);
    R.pos.y = 1.75 + nz(s.t, 0.35, 23) * 0.12;
    R.lens = 32; R.near = 1.0;
    _d.set(STERN_W.x, 20, STERN_W.z);
    placeAt(R, _d, -0.13, -0.12);
    R.focus = R.pos.distanceTo(_d); R.aperture = 0.04;
    R.roll = nz(s.t, 0.2, 24) * 0.8 * DEG;
  }, { shake: 0.3, hand: 0.3 });

  shot('break_plunge', 218, 222, (s, R) => {
    // in close and low, from the north-north-west: she slides straight down in front of the galactic core,
    // into her own reflection; the counter, the rudder and the screws go last (under by 221.5)
    sternBearing(lerp(152, 156, s.u), lerp(96, 88, s.u), 1.6 + nz(s.t, 0.33, 25) * 0.1, R.pos);
    R.lens = 31; R.near = 1.0;
    _a.set(STERN_W.x, lerp(25, 4, ease(clamp((s.t - 218) / 3.6))), STERN_W.z - 4);
    placeAt(R, _a, 0.04, 0.02);
    R.focus = R.pos.distanceTo(_a); R.aperture = 0.05;
    R.roll = nz(s.t, 0.2, 26) * 0.9 * DEG;
  }, { shake: 0.35, hand: 0.35, fadeOut: 0.9 });

  // ================= SILENCE 222–240 =================
  const SITE = V3(-70, 0, 20); // where she went down (the boats' reference point, TT.props)
  shot('silence_wide', 222, 229.5, (s, R) => {
    // low over the empty sea where she went down, looking north: the aurora, the boats' lanterns, mist
    R.pos.set(lerp(-40, -2, s.u), 3.0, -280);
    R.tgt.set(lerp(-40, -2, s.u) + 60, 62, 800);
    R.lens = 26; R.near = 1.0;
  }, { fadeIn: 1.8, hand: 0.15 });

  shot('silence_descend', 229.5, 235, (s, R) => {
    // "Titanic is gone": from the south, a slow crane down over the black water where she went down —
    // wreckage, the last bubbles, the mist — until the horizon and the aurora come down into the frame
    const u = ease(s.u);
    R.pos.set(lerp(-56, -64, u), lerp(14, 3.4, u), lerp(-70, -32, u));
    R.tgt.set(lerp(-72, -73, u), -2, lerp(40, 24, u));
    R.lens = 25;
  }, { hand: 0.1 });

  // the lifeboat that goes back (TT.story.BOATS index 11 = No. 14, lantern lit): she turns at 226-232
  // and pulls back toward the site through the mist (fade to the deep at 238.8)
  shot('silence_boat', 235, 240, (s, R) => {
    // "Of the twenty lifeboats, one goes back": low astern of No. 14 and off her starboard quarter
    // (clear of No. 16, which stays), riding with her; her lantern hangs at her stern; ahead of her
    // only the wreckage, the mist, the aurora and the stars
    boatPos(11, _a);
    _b.set(SITE.x - _a.x, 0, SITE.z - _a.z).normalize();                 // her course
    R.pos.copy(_a).addScaledVector(_b, -lerp(11.5, 10, s.u)).addScaledVector(_c.set(_b.z, 0, -_b.x), -3.4);
    R.pos.y = 1.9 + nz(s.t, 0.4, 27) * 0.1;
    R.lens = 30; R.near = 0.3;
    _d.copy(_a).setY(1.1);
    placeAt(R, _d, -0.3, -0.42);
    R.focus = R.pos.distanceTo(_d); R.aperture = 0.08;
    R.roll = nz(s.t, 0.3, 28) * 1.2 * DEG;
  }, { hand: 0.4 });

  // ================= DEEP 240–262 =================
  shot('deep_stern', 240, EV.abyss, (s, R) => {
    // under the surface, ~35 m off her starboard side: looking up at the sinking stern, screws and
    // rudder uppermost, black against the light from the surface (the shafts converge on Snell's
    // window above) and trailing her bubbles; she falls past us and the camera tilts down after her
    // as she recedes into the dark
    // (the camera sinks a little after her as she passes, which also eases the tilt)
    R.pos.set(-1.6 + 0.78 * 36, -72 - 8 * ease(s.u) - 16 * sstep(240.8, 243.6, s.t), 3.9 + 0.62 * 36);
    sternW(-128, -2, 0, _a);                                   // her screws and rudder
    R.lens = 36; R.near = 0.3;
    placeAt(R, _a, 0.12, lerp(-0.25, -0.05, sstep(240.5, 243, s.t)));
  }, { under: true, fadeOut: 0.6, hand: 0.2 });

  shot('deep_abyss', EV.abyss, 253.3, (s, R) => {
    // the abyss: held ~60 m beside her glide path, off her starboard side, looking up it — the bow
    // comes down at us out of the dark, stem first, a black knife-edged silhouette against the faint
    // light scattered through the water above, and planes past (marine snow drifts by)
    R.pos.set(97.5, lerp(-3750, -3762, ease(s.u)), 34);
    bowW(134, 12, 0, _a);                                       // her stem
    R.lens = 38; R.near = 0.5;
    placeAt(R, _a, 0.28, -0.15);
  }, { under: true, fadeIn: 0.7, hand: 0.25 });

  shot('deep_seabed', 253.3, 257.5, (s, R) => {
    // on the seabed ahead of her: she comes out of the dark and ploughs in
    const hd = 0.38;
    yawW(212, C.SEABED_Y + 6, 30, hd, R.pos);
    yawW(lerp(122, 140, s.u), C.SEABED_Y + lerp(44, 16, sstep(0, 0.6, s.u)), -4, hd, R.tgt);
    R.lens = 27; R.near = 0.5;
  }, { under: true, shake: 1.6 });

  shot('deep_rov', 257.5, 262, (s, R) => {
    // the camera sled's lamps find the bow railing: head-on, a little above and to port of her prow,
    // the rails converging on the stem, the silt she ploughed up banked either side
    bowW(lerp(150, 145, ease(s.u)), lerp(25.5, 24.5, s.u), lerp(-6.5, -5, s.u), R.pos);
    bowW(124, 17, 0, R.tgt);
    R.lens = 29; R.near = 0.2;
    bowW(134, 18, 0, _a);
    R.focus = R.pos.distanceTo(_a); R.aperture = 0.2;
  }, { under: true, hand: 0.4 });

  // ================= DAWN 262–292 =================
  shot('dawn_boat', 262, 271, (s, R) => {
    // No. 2 (the first boat Carpathia picked up) in the foreground; Carpathia on the horizon
    boatPos(15, _a);
    const cp = S.world.carpathiaPos;
    _b.copy(cp).sub(_a).setY(0).normalize();
    R.pos.copy(_a).addScaledVector(_b, -16).add(_c.set(-_b.z * 3.4, 2.6, _b.x * 3.4));
    R.tgt.copy(R.pos).addScaledVector(_b, 1000); R.tgt.y = R.pos.y - 1000 * Math.tan(2.0 * DEG);
    R.lens = 22; R.near = 0.5;
    R.focus = rack(16, 4000, sstep(0.3, 0.7, s.u)); R.aperture = 0.25;
  }, { hand: 0.5 });

  shot('dawn_carpathia', 271, 281, (s, R) => {
    // long lens, low, sliding sideways: Carpathia on the horizon, a tabular berg passing in front (parallax)
    const cp = S.world.carpathiaPos;
    _b.set(cp.x + 70, 0, cp.z - 20).normalize();          // from the wreck site toward Carpathia
    const off = lerp(95, 205, s.u);                          // sideways dolly
    R.pos.set(-70 - _b.x * 160 - _b.z * off, 3.2, 20 - _b.z * 160 + _b.x * off);
    R.lens = 6; R.near = 2;
    _d.set(cp.x, 11, cp.z);
    placeAt(R, _d, lerp(-0.02, -0.12, s.u), 0.1);
    R.focus = R.pos.distanceTo(_d); R.aperture = 0.05;
  }, { hand: 0.2 });

  // high and rising over the scattered boats, looking east into the dawn; then up into the sky (end card)
  function dawnHigh(t, R) {
    const u = clamp((t - 281) / 24);
    const e = ease(u);
    R.pos.set(lerp(760, 600, e), lerp(38, 300, e), lerp(330, 240, e));
    R.tgt.set(-1600, lerp(-175, 1400, sstep(0.3, 1, u)), -700);
    R.lens = lerp(22, 28, e); R.near = 1.5;
  }
  shot('dawn_high', 281, 292, (s, R) => dawnHigh(s.t, R));
  // ================= END 292–305 =================
  shot('end_sky', 292, 305, (s, R) => dawnHigh(s.t, R), { cont: true }); // the same move continues (no cut)

  // -------------------------------------------------------------------
  // Evaluation
  // -------------------------------------------------------------------
  const rig = { pos: V3(), tgt: V3(), roll: 0, lens: 24, focus: null, aperture: 0, near: 0.5, fade: 0 };
  const sctx = { t: 0, d: 0, u: 0 };
  function shotIndexAt(t) {
    let lo = 0, hi = SHOTS.length - 1, ans = 0;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (SHOTS[mid].t0 <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    return ans;
  }
  // keep the camera out of the berg: an ellipse ~70 x 50 m aligned with her course at impact, plus margin
  const BERG_A = 43, BERG_B = 33, BERG_ROT = TR.heading(EV.impact) - 0.6;
  function bergAvoid(p) {
    const I = S.iceberg;
    if (!I.visible || p.y > 40) return;
    const rot = I.yaw + BERG_ROT, c = Math.cos(rot), sn = Math.sin(rot);
    const dx = p.x - I.pos.x, dz = p.z - I.pos.z;
    const lx = dx * c - dz * sn, lz = dx * sn + dz * c;          // berg-canonical frame
    const e = Math.hypot(lx / BERG_A, lz / BERG_B);
    if (e >= 1 || e < 1e-4) return;
    const k = 1 / e;                                              // push radially onto the ellipse
    const nx = lx * k, nz = lz * k;
    p.x = I.pos.x + nx * c + nz * sn; p.z = I.pos.z - nx * sn + nz * c;
  }

  let lastIdx = -1, reported = false;
  const finite = (v) => isFinite(v.x) && isFinite(v.y) && isFinite(v.z);
  const api = {
    order: 70,
    shots: [],
    shotAt(t) { const s = SHOTS[shotIndexAt(t)]; return { name: s.name, t0: s.t0, t1: s.t1 }; },
    // world position of lifeboat i (TT.props when present, else the director's estimate)
    boatPos(i, out) { return boatPos(i, out || new THREE.Vector3()); },
    init(ctx) {
      this.shots = SHOTS.map((s) => ({ name: s.name, t0: s.t0, t1: s.t1 }));
      this.update(0, 0, ctx);
    },
    update(t, dt, ctx) {
      S = ctx.S || TT.S;
      const cam = ctx.camera;
      const idx = shotIndexAt(t);
      const sh = SHOTS[idx];
      sctx.t = t; sctx.d = t - sh.t0; sctx.u = clamp((t - sh.t0) / (sh.t1 - sh.t0));
      rig.roll = 0; rig.lens = 24; rig.focus = null; rig.aperture = 0; rig.near = 0.5; rig.fade = 0;
      try { sh.fn(sctx, rig); } catch (e) {
        if (!reported) { reported = true; TT.error('director ' + sh.name, e); }
        return; // keep last frame's camera
      }
      if (!finite(rig.pos) || !finite(rig.tgt) || rig.pos.distanceToSquared(rig.tgt) < 1e-6) return;

      // ---- handheld drift + shake (pure functions of t) ----
      const shake = (S.fx.shake || 0) * sh.shake;
      const hand = sh.hand;
      const yawN = (nz(t, 0.31, 1) * 0.55 * hand + nz(t, 6.5, 4) * 0.9 * shake) * DEG;
      const pitN = (nz(t, 0.27, 2) * 0.4 * hand + nz(t, 7.7, 5) * 0.8 * shake) * DEG;
      const rolN = (nz(t, 0.21, 3) * 0.6 * hand + nz(t, 4.9, 6) * 0.7 * shake) * DEG;
      cam.position.copy(rig.pos);
      if (shake > 0) {
        cam.position.x += nz(t, 5.3, 7) * 0.22 * shake;
        cam.position.y += nz(t, 6.1, 8) * 0.18 * shake;
        cam.position.z += nz(t, 5.7, 9) * 0.22 * shake;
      }
      // ---- keep out of the water, the berg ----
      if (!sh.under) {
        bergAvoid(cam.position);
        const floor = Math.max(1.5, seaY(cam.position.x, cam.position.z) + 1.0);
        if (cam.position.y < floor) cam.position.y = floor;
      } else if (cam.position.y > -2) cam.position.y = -2;

      // ---- orientation ----
      _m.lookAt(cam.position, rig.tgt, UP);
      cam.quaternion.setFromRotationMatrix(_m);
      _qe.set(pitN, yawN, rig.roll + rolN, 'YXZ');
      cam.quaternion.multiply(_q.setFromEuler(_qe));
      cam.up.set(0, 1, 0);

      // ---- lens: frame the 2.39:1 band identically on any aspect ----
      const w = ctx.width || window.innerWidth, h = ctx.height || window.innerHeight;
      const bandH = Math.min(h, w / BAND);
      const k = h / Math.max(1, bandH);
      const fov = 2 * Math.atan(Math.tan(rig.lens * DEG / 2) * k) / DEG;
      cam.fov = Math.min(100, fov); // very tall (portrait) windows: stop widening, crop the sides instead
      cam.near = Math.max(0.1, rig.near);
      cam.far = C.CAMERA.far;
      cam.aspect = w / Math.max(1, h);
      cam.updateProjectionMatrix();
      cam.updateMatrixWorld(true);

      // ---- hints ----
      const ud = cam.userData;
      ud.focus = rig.focus != null ? rig.focus : cam.position.distanceTo(rig.tgt);
      ud.aperture = rig.aperture;
      let fade = rig.fade;
      if (sh.fadeIn > 0) fade = Math.max(fade, 1 - sstep(sh.t0, sh.t0 + sh.fadeIn, t));
      if (sh.fadeOut > 0) fade = Math.max(fade, sstep(sh.t1 - sh.fadeOut, sh.t1, t));
      ud.fade = fade;
      ud.shot = sh.name;
      ud.letterbox = null;
      ud.cut = idx !== lastIdx && !(sh.cont && idx === lastIdx + 1); // first frame of a new shot (motion blur / TAA resets)
      lastIdx = idx;
    },
  };
  TT.register('director', api);
})();

// 80_ui.js — the overlay: start / loading screen, letterbox, captions,
// wireless typewriter (Marconigram), depth gauge, player controls, end state.
// Owner: ui agent. Pure DOM (no canvas). Every visible element is a pure
// function of story time t, so seeking and freeze-frame stills look right.
// =====================================================================
(() => {
  const U = TT.util, C = TT.CONST;
  const PRM = TT.params || {};
  const DUR = C.DURATION;
  const clamp = U.clamp, sstep = U.smoothstep;

  const HIDE = PRM.hideui === '1';
  const NOSTART = PRM.autoplay === '1' || PRM.freeze === '1';
  const FORCE_CTL = PRM.showcontrols === '1';
  let reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }

  // ------------------------------------------------------------------ helpers
  function el(tag, cls, parent, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtTime = (s) => { s = Math.max(0, Math.floor(s + 1e-6)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtInt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI'];
  // cached style writes: touch the DOM only when a value really changes
  function css(node, prop, val) {
    const k = '_c_' + prop;
    if (node[k] === val) return;
    node[k] = val;
    if (prop.charCodeAt(0) === 45) node.style.setProperty(prop, val); else node.style[prop] = val;
  }
  function cls(node, name, on) {
    const k = '_k_' + name;
    if (node[k] === on) return;
    node[k] = on;
    node.classList.toggle(name, on);
  }
  function text(node, s) { if (node._txt !== s) { node._txt = s; node.textContent = s; } }
  function store(k, v) {
    try { if (v === undefined) return window.localStorage.getItem('tt.' + k); window.localStorage.setItem('tt.' + k, String(v)); } catch (e) { /* private mode */ }
    return null;
  }

  // Ship's clock (minutes after 23:00 on 14 April) from the story's own time slugs — used to
  // stamp the Marconigrams when a message has no explicit time.
  function parseClock(s) {
    if (/midnight/i.test(s)) return 60;
    const m = /(\d{1,2}):(\d{2})\s*([ap])\.?\s*m/i.exec(s || '');
    if (!m) return null;
    let h = +m[1] % 12; if (/p/i.test(m[3])) h += 12;
    let min = h * 60 + +m[2];
    if (min < 12 * 60) min += 24 * 60;
    return min - 23 * 60;
  }
  function fmtClock(min) {
    let tot = (Math.round(min / 5) * 5 + 23 * 60) % (24 * 60);
    const h24 = Math.floor(tot / 60), mm = tot % 60;
    if (h24 === 0 && mm === 0) return 'Midnight';
    const h = h24 % 12 === 0 ? 12 : h24 % 12;
    return h + ':' + String(mm).padStart(2, '0') + (h24 < 12 ? ' a.m.' : ' p.m.');
  }
  // Historical times for the two wireless calls (ship's time): first CQD ~12:15 a.m.,
  // "sinking fast" traffic ~1:40 a.m.
  const WIRE_TIME = { CQD: '12:15 a.m.', SOS: '1:40 a.m.' };

  // ------------------------------------------------------------------ styles
  const STYLE = `
#tt-ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:var(--frost);font-family:var(--font-body);
  --bar:0px;--lift:0px;--gut:max(16px,4.2vw);--anchor:max(calc(var(--bar) * .5),calc(8vh + env(safe-area-inset-bottom)));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-kerning:normal;text-rendering:optimizeLegibility;overflow:hidden}
#tt-ui *,#tt-ui *::before,#tt-ui *::after{box-sizing:border-box}
:where(#tt-ui) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;border-radius:0}
:where(#tt-ui) :focus{outline:none}
:where(#tt-ui) :focus-visible{outline:1px solid var(--buff);outline-offset:4px}

#tt-ui.idle .tt-stage{cursor:none}

.tt-lb.t{top:0}.tt-lb.b{bottom:0}

/* ---------------- captions ---------------- */

  transition:transform .55s cubic-bezier(.2,.7,.2,1)}

  color:#e6e8e6;text-wrap:balance;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 24px rgba(0,0,0,.75)}

  text-shadow:0 0 50px rgba(0,0,0,.55)}

  // A distant, lit Titanic on the horizon, drawn from the canonical hull numbers (metres,
  // bow to the right, seen from starboard). Waterline y = 0 sits at 64/92 of the height.
  function shipSVG() {
    const SH = C.SHIP, r = U.rng('tt-start-ship'), f = (v) => v.toFixed(2);
    const rake = Math.tan(SH.FUNNEL_RAKE);
    let hull = 'M' + f(SH.STERN_WL_X) + ' 0 L' + f(SH.STERN_X) + ' -7';
    for (let x = SH.STERN_X; x <= SH.STEM_X; x += 2) hull += ' L' + f(x) + ' ' + f(-TT.hull.sheer(x));
    hull += ' L' + f(SH.STEM_X) + ' ' + f(-TT.hull.sheer(SH.STEM_X)) + ' L' + f(SH.STEM_X) + ' 0 Z';
    const sx0 = SH.SUPERSTRUCTURE_X[0], sx1 = SH.SUPERSTRUCTURE_X[1];

      '<rect x="-58" y="-22.6" width="116" height="2.9" fill="#12161e"/>' +
      '<rect x="' + (SH.BRIDGE_X - 8) + '" y="-23.2" width="8" height="3.5" fill="#141922"/>';
    let fun = '';
    for (const x of SH.FUNNEL_X) {
      const bt = SH.FUNNEL_BASE_Y, tp = SH.FUNNEL_TOP_Y, rx = SH.FUNNEL_RX, dx = (tp - bt) * rake, bk = tp - 3.8, dk = (bk - bt) * rake;
      fun += '<path d="M' + f(x - rx) + ' ' + -bt + 'L' + f(x + rx) + ' ' + -bt + 'L' + f(x + rx - dx) + ' ' + -tp + 'L' + f(x - rx - dx) + ' ' + -tp + 'Z" fill="#2c2217"/>' +
        '<path d="M' + f(x - rx - dk) + ' ' + f(-bk) + 'L' + f(x + rx - dk) + ' ' + f(-bk) + 'L' + f(x + rx - dx) + ' ' + -tp + 'L' + f(x - rx - dx) + ' ' + -tp + 'Z" fill="#07080a"/>';
    }
    const fm = [SH.FOREMAST_X, SH.FOREMAST_TOP_Y], mm = [SH.MAINMAST_X, SH.MAINMAST_TOP_Y];
    const mtop = (m, y0) => f(m[0] - (m[1] - y0) * rake);
    const rig = '<g stroke="#232935" stroke-width=".45" fill="none" opacity=".75">' +
      '<path d="M' + fm[0] + ' -16L' + mtop(fm, 16) + ' ' + -fm[1] + '"/>' +
      '<path d="M' + mm[0] + ' -15.8L' + mtop(mm, 15.8) + ' ' + -mm[1] + '"/>' +
      '<path d="M' + mtop(fm, 16) + ' ' + -fm[1] + 'L' + mtop(mm, 15.8) + ' ' + -mm[1] + '" stroke-width=".22" opacity=".45"/></g>';
    // lights: portholes on the hull decks, brighter promenade and saloon windows above
    let lights = '', refl = '';

    for (const [y, keep, br] of rows) {
      const e = TT.hull.ends(-y);
      let x0 = e.aft + 5, x1 = e.fwd - 6;
      if (y < -15) { x0 = sx0 + 2; x1 = sx1 - 2; }

        const a = br * (0.55 + 0.45 * r());

        if (r() < 0.22) {

    return '<svg class="ship" viewBox="-140 -64 280 92" aria-hidden="true" focusable="false">' +
      '<defs><filter id="ttGlow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation=".75" result="b"/>' +
      '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      '<filter id="ttRefl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".5 2.2"/></filter>' +

      '<g class="refl" fill="url(#ttReflG)" filter="url(#ttRefl)">' + refl + '</g>' +

  function wireTime(m) {
    if (m.time) return m.time;

    const anchors = [];

      const v = parseClock(c.text);

  // ------------------------------------------------------------------ scrubber
  function measure() {

    }

  }
  function timeAtX(x) {

    for (let i = 0; i < g.length; i++) {
      const s = g[i], sc = SC[i];
      const edge = i + 1 < g.length ? (s.x + s.w + g[i + 1].x) / 2 : Infinity;
      if (x < edge) return sc.t0 + clamp((x - s.x) / s.w) * (sc.t1 - sc.t0);
    }

  }

    text(R.tipS, fmtTime(t));

    R.segs.forEach((g) => cls(g.d, 'hv', g.i === i));

  }
  function bindScrub() {

    if (frameAcc < 2.0) return;
    const fps = frameCount / frameAcc;
    frameAcc = 0; frameCount = 0;
    let next = dpr;
    if (fps < 42 && dpr > 0.55) next = Math.max(0.55, dpr * 0.85);
    else if (fps > 58 && dpr < baseDpr) next = Math.min(baseDpr, dpr * 1.08);
    if (Math.abs(next - dpr) > 0.01) { dpr = next; renderer.setPixelRatio(dpr); onResize(); }
  }

  function updateAll(t, dt) {
    ctx.time = t; ctx.dt = dt;
    for (const m of mods) {
      if (!m._ready || !m.update) continue;
      try { m.update(t, dt, ctx); } catch (e) {
        m._errCount = (m._errCount || 0) + 1;
        if (m._errCount < 4) TT.error('update ' + m.name, e);
      }
    }
    for (const p of proxies) p.update(t, dt, ctx);
    if (!TT.director || !TT.director._ready) defaultCamera(t);
    if (camOverride) {
      camera.position.set(camOverride[0], camOverride[1], camOverride[2]);
      camera.up.set(0, 1, 0);
      camera.lookAt(camOverride[3], camOverride[4], camOverride[5]);
      if (camOverride[6]) { camera.fov = camOverride[6]; camera.updateProjectionMatrix(); }
      camera.userData.focus = camera.position.distanceTo(new THREE.Vector3(camOverride[3], camOverride[4], camOverride[5]));
    }
  }

  // Default camera when there is no director: a slow three-quarter view of the ship.
  function defaultCamera(t) {
    const S = TT.S;
    if (S.env.underwater) {
      const tgt = S.ship.bowVisible ? S.ship.bow.pivotWorld : S.ship.stern.pivotWorld;
      camera.position.set(tgt.x + 120, tgt.y + 30, tgt.z + 160);
      camera.lookAt(tgt);
    } else {
      const a = 0.9 + t * 0.004;
      camera.position.set(Math.cos(a) * 380, 55, Math.sin(a) * 380);
      camera.lookAt(0, 12, 0);
    }
  }

  // Warm-up for stills: simulate a few seconds before t so stateful effects settle
  if (P.freeze === '1' && P.warm) {
    const w = Math.max(0, parseFloat(P.warm) || 0), step = 1 / 30;
    for (let tt = Math.max(0, startT - w); tt < startT; tt += step) updateAll(tt, step);
  }

  // ---------- rehearsal: compile every shader and upload every texture before Begin ----------
  // Shaders compile lazily the first time an object is drawn; on D3D/ANGLE that froze the film for
  // seconds at the title and at new scenes. Visit one moment of every shot (plus transient effects)
  // with the canvas hidden, compiling and rendering each, while the start screen shows progress.
  if (P.freeze !== '1' && P.nowarm !== '1') {
    const EV = TT.story.EV, times = [];
    const shots = (TT.director && TT.director._ready && TT.director.shots) || [];
    for (const sh of shots) times.push(Math.min(sh.t1 - 0.05, sh.t0 + Math.min(1.5, (sh.t1 - sh.t0) / 2)));
    if (!shots.length) for (let tt = 4; tt < C.DURATION; tt += 10) times.push(tt);
    times.push(...EV.rockets.map((r) => r + 2.6), EV.impact + 2, EV.funnel1Splash + 0.5, EV.breakApart, EV.sternSplash + 0.4,
      EV.sternGone + 1.5, EV.seabedImpact + 1, EV.rov + 1, EV.dawn + 2, 290);
    times.sort((a, b) => a - b);
    const cv = renderer.domElement, prevVis = cv.style.visibility;
    cv.style.visibility = 'hidden';
    const hasAsync = typeof renderer.compileAsync === 'function';
    const t0w = performance.now();
    for (let i = 0; i < times.length; i++) {
      try {
        updateAll(times[i], 1 / 30);
        TT.S.grade.fade = 0; camera.userData.fade = 0;
        if (hasAsync) await renderer.compileAsync(scene, camera);
        if (TT.fx && TT.fx._ready && TT.fx.render && P.nofx !== '1') TT.fx.render(ctx, 1 / 30);
        else renderer.render(scene, camera);
      } catch (e) { TT.error('rehearsal t=' + times[i], e); }
      TT.emit('progress', { f: 0.72 + 0.28 * (i + 1) / times.length, label: 'Rehearsing the night', abs: true });
      await new Promise((r) => setTimeout(r, 0));
    }
    cv.style.visibility = prevVis;
    TT.log('rehearsal ' + times.length + ' moments in ' + (performance.now() - t0w).toFixed(0) + 'ms');
  }
  TT.clock.seek(startT);
  updateAll(startT, 0);
  TT.emit('ready', ctx);

  // ---------- loop ----------
  let lastPerf = performance.now();
  let ended = false;
  let frames = 0;
  function frame() {
    const nowPerf = performance.now();
    const dt = Math.min(0.1, (nowPerf - lastPerf) / 1000);
    lastPerf = nowPerf;
    let t = TT.clock.now();
    const dur = C.DURATION;
    if (t >= dur && !ended && TT.clock.playing && TT.clock.frozen == null) { ended = true; TT.emit('end', t); }
    if (t < dur) ended = false;
    t = Math.min(t, dur);
    ctx.realTime += dt;
    updateAll(t, dt);
    try {
      if (TT.fx && TT.fx._ready && TT.fx.render && P.nofx !== '1') TT.fx.render(ctx, dt);
      else renderer.render(scene, camera);
    } catch (e) {
      TT._renderErr = (TT._renderErr || 0) + 1;
      if (TT._renderErr < 4) TT.error('render', e);
      if (TT._renderErr === 3) { try { renderer.render(scene, camera); } catch (e2) { /* ignore */ } }
    }
    adapt(dt);
    frames++;
    if (P.freeze === '1' && frames === 4) {
      const info = renderer.info.render;
      console.log('TT_FRAME_READY t=' + t.toFixed(2) + ' shot=' + camera.userData.shot + ' calls=' + info.calls + ' tris=' + info.triangles + ' errors=' + TT.errors.length);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- visible error panel in debug mode ----------
  if (TT.debug) {
    const panel = document.createElement('pre');
    panel.style.cssText = 'position:fixed;left:8px;bottom:8px;max-width:60vw;max-height:40vh;overflow:auto;margin:0;padding:8px;background:rgba(40,0,0,.85);color:#fdd;font:11px/1.35 monospace;z-index:99999;white-space:pre-wrap';
    panel.hidden = true;
    document.body.appendChild(panel);
    setInterval(() => {
      if (!TT.errors.length) return;
      panel.hidden = false;
      panel.textContent = TT.errors.slice(-8).map((e) => e.where + ': ' + e.message).join('\n\n');
    }, 1000);
  }
  window.addEventListener('error', (e) => TT.error('window', e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => TT.error('promise', e.reason));

  // ================================================================
  // Proxies
  // ================================================================
  function makeProxyShip(scene) {
    const SH = C.SHIP;
    const hullMat = new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.6 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xd8d4c8, roughness: 0.7 });
    const buffMat = new THREE.MeshStandardMaterial({ color: 0xc58a3e, roughness: 0.6 });
    const winMat = new THREE.MeshBasicMaterial({ color: 0xffc070 });
    function section(x0, x1) {
      const g = new THREE.Group();
      // hull as a lofted box approximation using TT.hull
      const n = 40, geo = new THREE.BufferGeometry(), pos = [], idx = [];
      for (let i = 0; i <= n; i++) {
        const x = U.lerp(x0, x1, i / n);
        const top = TT.hull.sheer(x);
        const hb = Math.max(0.3, TT.hull.halfBeam(x, 2));
        const hk = Math.max(0.3, TT.hull.halfBeam(x, -8));
        pos.push(x, top, -hb, x, SH.KEEL_Y + 1, -hk, x, SH.KEEL_Y + 1, hk, x, top, hb);
      }
      for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) {
        const a = i * 4 + k, b = a + 1, c = a + 4, d = a + 5;
        idx.push(a, c, b, b, c, d);
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setIndex(idx); geo.computeVertexNormals();
      const hull = new THREE.Mesh(geo, hullMat); hull.material.side = THREE.DoubleSide;
      g.add(hull);
      const sx0 = Math.max(x0, SH.SUPERSTRUCTURE_X[0]), sx1 = Math.min(x1, SH.SUPERSTRUCTURE_X[1]);
      if (sx1 > sx0) {
        const sup = new THREE.Mesh(new THREE.BoxGeometry(sx1 - sx0, SH.BOAT_DECK_Y - SH.HULL_TOP_Y, 26), whiteMat);
        sup.position.set((sx0 + sx1) / 2, (SH.BOAT_DECK_Y + SH.HULL_TOP_Y) / 2, 0);
        g.add(sup);
        for (let r = 0; r < 3; r++) {
          const w = new THREE.Mesh(new THREE.BoxGeometry(sx1 - sx0 - 2, 0.35, 28.3), winMat);
          w.position.set((sx0 + sx1) / 2, 6 + r * 3.2, 0);
          g.add(w);
        }
      }
      SH.FUNNEL_X.forEach((fx) => {
        if (fx < x0 || fx > x1) return;
        const f = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, SH.FUNNEL_TOP_Y - SH.FUNNEL_BASE_Y, 20), buffMat);
        f.scale.set(SH.FUNNEL_RX, 1, SH.FUNNEL_RZ);
        f.position.set(fx, (SH.FUNNEL_TOP_Y + SH.FUNNEL_BASE_Y) / 2, 0);
        f.rotation.z = SH.FUNNEL_RAKE;
        g.add(f);
      });
      return g;
    }
    const bow = section(SH.BREAK_X, SH.STEM_X), stern = section(SH.STERN_X, SH.BREAK_X);
    bow.name = 'proxy bow'; stern.name = 'proxy stern';
    scene.add(bow, stern);
    return {
      update() {
        const S = TT.S.ship;
        TT.pose.apply(bow, S.bow); TT.pose.apply(stern, S.stern);
        bow.visible = S.visible && S.bowVisible; stern.visible = S.visible && S.sternVisible;
        winMat.color.setRGB(1 * S.lights, 0.75 * S.lights, 0.44 * S.lights);
      },
    };
  }
  function makeProxyBerg(scene) {
    const g = new THREE.IcosahedronGeometry(28, 3);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const n = 1 + 0.25 * Math.sin(x * 0.2) * Math.cos(z * 0.17) + 0.15 * Math.sin(y * 0.3);
      p.setXYZ(i, x * n * 1.1, y * n * (y > 0 ? 1.0 : 2.2), z * n * 0.9);
    }
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x9fb4c8, roughness: 0.8 }));
    m.name = 'proxy iceberg';
    scene.add(m);
    return { update() { const I = TT.S.iceberg; m.visible = I.visible > 0; m.position.copy(I.pos); m.rotation.y = I.yaw; } };
  }
})();

</script>
